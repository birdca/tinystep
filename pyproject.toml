[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "tinystep"
version = "0.1.0"
description = "Personal Atomic Habits, Capacity Management & Overestimation Calculator Agent"
readme = "README.md"
requires-python = ">=3.8"
dependencies = [
    "rich>=12.0.0",
]

[project.scripts]
tinystep = "tinystep.cli:main"
